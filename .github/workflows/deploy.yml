name: Build and Deploy Fullstack App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-app-template
  INSTANCE_ID: i-0763c275a44301232
  PUBLIC_URL: http://3.108.70.64

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend build diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend build diagnostics
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          echo "Frontend built successfully (dist artifacts present)"
          ls -la dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS credentials configured via environment"

      - name: Build and push Docker image
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building unified image: $FULL_IMAGE"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" .
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          echo "IMAGE_URI=$FULL_IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="$ECR_REGISTRY"
          IMAGE_URI="$IMAGE_URI"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then echo "SSM command did not succeed"; exit 1; fi

      - name: Wait for service startup
        run: sleep 60

      - name: Health check (must return HTTP 200)
        run: |
          set -e
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "Health check attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment verified: $PUBLIC_URL returned HTTP 200"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed: $PUBLIC_URL did not return HTTP 200"
          exit 1