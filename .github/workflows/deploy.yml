name: Build and Deploy Fullstack App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-app-template
  IMAGE_TAG: ${{ github.sha }}
  INSTANCE_ID: i-0763c275a44301232
  PUBLIC_URL: http://3.108.70.64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build unified production image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --file Dockerfile \
            --tag "$FULL_IMAGE:$IMAGE_TAG" \
            --tag "$FULL_IMAGE:latest" \
            --load \
            .

      - name: Push image to Amazon ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV

      - name: Deploy container on EC2 via SSM
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${IMAGE_URI}"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for application startup
        run: sleep 60

      - name: Health check (must return HTTP 200)
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$PUBLIC_URL/" || echo "000")
            echo "Attempt $i — HTTP status: $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment verified: $PUBLIC_URL is healthy."
              exit 0
            fi
            sleep 20
          done
          echo "Health check failed after all attempts."
          exit 1