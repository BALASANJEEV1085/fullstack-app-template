name: Build and Deploy Full-Stack App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-app-template
  INSTANCE_ID: i-0763c275a44301232
  PUBLIC_URL: http://3.108.70.64

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          aws sts get-caller-identity

      - name: Build unified production image
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building image: $FULL_IMAGE:latest"
          docker build \
            --build-arg VITE_API_BASE_URL="" \
            -t "$FULL_IMAGE:latest" \
            -t "$FULL_IMAGE:${GITHUB_SHA::8}" \
            -f Dockerfile .

      - name: Build diagnostics
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "=== Image inspection ==="
          docker image inspect "$FULL_IMAGE:latest" --format 'ID: {{.Id}}{{"\n"}}Size: {{.Size}} bytes'
          echo "=== Exposed ports ==="
          docker image inspect "$FULL_IMAGE:latest" --format '{{json .Config.ExposedPorts}}'
          echo "=== Image layers/history (last 10) ==="
          docker history --no-trunc "$FULL_IMAGE:latest" | head -11

      - name: Push image to Amazon ECR
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::8}"
          echo "Pushed: $FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fullstack-app-template ${GITHUB_SHA::8}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment command failed"
            exit 1
          fi

      - name: Verify deployment health (HTTP 200 required)
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/" || echo "000")
            echo "Attempt $i — HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed: $PUBLIC_URL returned 200"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed — $PUBLIC_URL did not return HTTP 200"
          exit 1

      - name: Deployment summary
        run: |
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Deployed to EC2 instance: $INSTANCE_ID"
          echo "Public URL: $PUBLIC_URL (container port 80)"
          echo "Commit: $GITHUB_SHA"